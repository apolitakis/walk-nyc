# Cloudflare Pages project for Walk NYC. Deploy (only when Alex says "ship"):
#   cd hosting/cloudflare && npx wrangler pages deploy public --project-name walk-nyc --branch main
# One-time setup is in SHIPPING.md (create the KV namespace and R2 bucket, put the KV id below, set FEEDBACK_KEY).
name = "walk-nyc"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "003213e7c17444ba9ec3cdc0fc19418e"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "walk-nyc-audio"
