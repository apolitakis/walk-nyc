# Uploads recorded narration to Cloudflare R2 from a GitHub release.
# The A40 runs voices/publish_audio.sh, which attaches audio.tar.gz (out/audio/*.mp3 + manifest.json)
# to a release tagged audio-YYYYMMDD-HHMM. Publishing that release triggers this workflow.
# The Cloudflare token lives only in the repository secret CLOUDFLARE_R2_TOKEN, never on the A40.
name: Upload audio to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. audio-20261118-0145)"
        required: true

permissions:
  contents: read

concurrency:
  group: upload-audio
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'audio-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      BUCKET: walk-nyc-audio
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release asset
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern audio.tar.gz --dir .
          mkdir audio && tar -xzf audio.tar.gz -C audio
          test -f audio/manifest.json
          echo "$(ls audio/*.mp3 | wc -l) mp3s in $TAG"

      - name: Upload mp3s, then manifest.json last
        working-directory: audio
        run: |
          npm install --no-save --silent wrangler@4
          W=./node_modules/.bin/wrangler
          [ -x "$W" ] || W="npx --yes wrangler@4"
          total=$(ls *.mp3 | wc -l); n=0
          for f in *.mp3; do
            n=$((n+1)); echo "[$n/$total] $f"
            $W r2 object put "$BUCKET/audio/$f" --file "$f" --content-type audio/mpeg --remote >/dev/null
          done
          $W r2 object put "$BUCKET/audio/manifest.json" --file manifest.json --content-type application/json --remote >/dev/null
          echo "Uploaded $total tracks + manifest.json from $TAG"

      - name: Check the live site serves it
        run: |
          curl -fsS https://walk-nyc.pages.dev/audio/manifest.json -o live.json
          python3 -c "import json;json.load(open('live.json'));print('manifest OK')"
          first=$(ls audio/*.mp3 | head -1 | xargs basename)
          curl -fsS -o /dev/null -w "%{http_code} $first\n" "https://walk-nyc.pages.dev/audio/$first"
